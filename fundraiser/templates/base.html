<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Fundraiser{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }

    nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 2rem; display: flex; align-items: center; gap: 2rem; height: 60px; }
    nav a { text-decoration: none; color: #6b7280; font-size: 0.9rem; font-weight: 500; }
    nav a:hover { color: #4f46e5; }
    nav .brand { font-size: 1.1rem; font-weight: 700; color: #4f46e5; margin-right: auto; }

    .container { max-width: 780px; margin: 3rem auto; padding: 0 1.5rem; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04); padding: 2rem; }

    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.4rem; }
    h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 1rem; }
    .subtitle { color: #6b7280; margin-bottom: 2rem; }

    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.35rem; color: #374151; }
    input[type=text], input[type=email], input[type=number], textarea {
      width: 100%; padding: 0.6rem 0.85rem; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 0.95rem; outline: none; transition: border .15s;
    }
    input:focus, textarea:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    textarea { resize: vertical; min-height: 120px; }
    .field { margin-bottom: 1.25rem; }

    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.6rem 1.4rem;
      border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      border: none; text-decoration: none; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-outline { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    .btn-sm { padding: .35rem .9rem; font-size: .82rem; }

    .badge { display: inline-block; padding: .2rem .65rem; border-radius: 99px; font-size: .78rem; font-weight: 600; }
    .badge-pending  { background: #fef3c7; color: #92400e; }
    .badge-approved { background: #d1fae5; color: #065f46; }
    .badge-denied   { background: #fee2e2; color: #991b1b; }

    .flash { padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: .9rem; }
    .flash-error   { background: #fee2e2; color: #991b1b; }
    .flash-success { background: #d1fae5; color: #065f46; }

    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 1.5rem 0; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="brand">🌱 FundraiseHub</a>
  <a href="/submit">Submit Request</a>
  <a href="/status">Check Status</a>
  <a href="/admin">Admin</a>
</nav>

<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
