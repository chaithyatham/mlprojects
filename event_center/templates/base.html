<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Willow Hall{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="{{ url_for('home') }}">Willow <span>Hall</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('home') }}#spaces">The venue</a>
      <a href="{{ url_for('book') }}">Request a date</a>
      <a href="{{ url_for('owner_dashboard') }}">Owner portal</a>
    </nav>
    <a class="button button-small" href="{{ url_for('book') }}">Book a date</a>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
