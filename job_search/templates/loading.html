<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Startup Job Finder — Searching</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background: #0a0e1a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

    .loader-card { background: #111827; border: 1px solid #1e2d45; border-radius: 20px; padding: 60px 50px; text-align: center; max-width: 560px; width: 100%; }

    .pulse-icon {
      width: 80px; height: 80px; background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px; animation: pulse 2s ease-in-out infinite;
    }
    .pulse-icon i { font-size: 2rem; color: white; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); } 50% { box-shadow: 0 0 0 20px rgba(99,102,241,0); } }

    .progress { height: 10px; background: #1e2d45; border-radius: 10px; margin: 24px 0 12px; }
    .progress-bar { background: linear-gradient(90deg, #3b82f6, #6366f1, #a78bfa); border-radius: 10px; transition: width 0.6s ease; }

    .status-msg { color: #94a3b8; font-size: 1rem; min-height: 24px; }
    .pct-label { font-size: 2rem; font-weight: 800; color: #60a5fa; }

    .log-feed { text-align: left; background: #0f172a; border-radius: 10px; padding: 16px; max-height: 160px; overflow-y: auto; margin-top: 20px; }
    .log-entry { font-size: 0.8rem; color: #64748b; padding: 2px 0; font-family: monospace; }
    .log-entry.active { color: #94a3b8; }

    .error-box { background: #1f0a0a; border: 1px solid #7f1d1d; border-radius: 10px; padding: 16px; margin-top: 20px; text-align: left; display: none; }
  </style>
</head>
<body>
<div class="loader-card">
  <div class="pulse-icon"><i class="fas fa-robot"></i></div>
  <h2 class="fw-bold mb-2">Searching startup PM roles</h2>
  <p style="color:#64748b">This takes 30–60 seconds. The app is scanning public Ashby, Greenhouse, and Lever boards live.</p>

  <div class="pct-label" id="pctLabel">0%</div>

  <div class="progress">
    <div class="progress-bar" id="bar" style="width:0%"></div>
  </div>
  <div class="status-msg" id="statusMsg">Starting…</div>

  <div class="log-feed" id="logFeed"></div>

  <div class="error-box" id="errorBox">
    <strong style="color:#f87171"><i class="fas fa-exclamation-circle me-2"></i>Error</strong>
    <pre id="errorText" style="color:#fca5a5;font-size:0.75rem;margin-top:8px;white-space:pre-wrap"></pre>
    <a href="/" class="btn btn-sm btn-outline-danger mt-2">Try again</a>
  </div>
</div>

<script>
  const JOB_ID = "{{ job_id }}";
  const bar = document.getElementById('bar');
  const pctLabel = document.getElementById('pctLabel');
  const statusMsg = document.getElementById('statusMsg');
  const logFeed = document.getElementById('logFeed');
  const errorBox = document.getElementById('errorBox');

  let lastMsg = '';

  function addLog(msg) {
    if (msg === lastMsg) return;
    lastMsg = msg;
    // De-activate old entries
    logFeed.querySelectorAll('.log-entry.active').forEach(e => e.classList.remove('active'));
    const div = document.createElement('div');
    div.className = 'log-entry active';
    div.textContent = '› ' + msg;
    logFeed.appendChild(div);
    logFeed.scrollTop = logFeed.scrollHeight;
  }

  function poll() {
    fetch(`/api/status/${JOB_ID}`)
      .then(r => r.json())
      .then(data => {
        const pct = data.progress || 0;
        bar.style.width = pct + '%';
        pctLabel.textContent = pct + '%';
        statusMsg.textContent = data.message || '';
        addLog(data.message || '');

        if (data.status === 'complete') {
          window.location.href = `/results/${JOB_ID}`;
          return;
        }
        if (data.status === 'error') {
          errorBox.style.display = 'block';
          document.getElementById('errorText').textContent = data.error || 'Unknown error';
          return;
        }
        setTimeout(poll, 1500);
      })
      .catch(() => setTimeout(poll, 3000));
  }

  setTimeout(poll, 800);
</script>
</body>
</html>
